<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>치매예방 틀린그림찾기</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    /* 모든 버튼의 공통 디자인 */
    button {
      border: none;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 3px solid #315a9b;
      outline-offset: 3px;
    }

    /* 시작 버튼과 난이도 버튼 */
    #start-button,
    .difficulty-button {
      min-width: 140px;
      background-color: #dcecff;
      color: #23446e;
    }

    #start-button:hover,
    .difficulty-button:hover {
      background-color: #c6e0ff;
    }

    /* 뒤로가기 버튼 */
    .back-button {
      position: fixed;
      top: 16px;
      left: 16px;
      padding: 10px 20px;
      background-color: #eeeeee;
      color: #333333;
      font-size: 16px;
    }

    .back-button:hover {
      background-color: #dddddd;
    }

    /* 메인 화면 */
    #main-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* 난이도 선택 화면 */
    #difficulty-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      padding-top: 33vh;
    }

    #difficulty-screen h2 {
      margin: 0 0 16px;
    }

    .difficulty-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* 게임 화면 */
    #game-screen {
      display: none;
    }
  </style>
</head>
<body>
  <!-- 1. 메인 화면 -->
  <div id="main-screen">
    <h1>치매예방 틀린그림찾기</h1>
    <button type="button" id="start-button">시작</button>
  </div>

  <!-- 2. 난이도 선택 화면 -->
  <div id="difficulty-screen">
    <button type="button" id="back-to-main" class="back-button">
      뒤로가기
    </button>

    <h2>난이도를 선택하세요</h2>

    <div class="difficulty-buttons">
      <button type="button" class="difficulty-button" data-level="하">하</button>
      <button type="button" class="difficulty-button" data-level="중">중</button>
      <button type="button" class="difficulty-button" data-level="상">상</button>
    </div>
  </div>

  <!-- 3. 게임 화면 -->
  <div id="game-screen">
    <button type="button" id="back-to-difficulty" class="back-button">
      뒤로가기
    </button>

    <div id="game-container"></div>
  </div>

  <script>
    const mainScreen = document.getElementById("main-screen");
    const difficultyScreen = document.getElementById("difficulty-screen");
    const gameScreen = document.getElementById("game-screen");

    const startButton = document.getElementById("start-button");
    const difficultyButtons = document.querySelectorAll(".difficulty-button");
    const backToMainButton = document.getElementById("back-to-main");
    const backToDifficultyButton = document.getElementById("back-to-difficulty");

    // 추후 게임 로직에서 사용할 선택 난이도
    let selectedLevel = null;

    // 메인 화면 → 난이도 선택 화면
    startButton.addEventListener("click", function () {
      mainScreen.style.display = "none";
      difficultyScreen.style.display = "flex";
    });

    // 난이도 선택 화면 → 게임 화면
    difficultyButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        selectedLevel = button.dataset.level;

        difficultyScreen.style.display = "none";
        gameScreen.style.display = "block";
      });
    });

    // 난이도 선택 화면 → 메인 화면
    backToMainButton.addEventListener("click", function () {
      difficultyScreen.style.display = "none";
      mainScreen.style.display = "flex";
    });

    // 게임 화면 → 난이도 선택 화면
    backToDifficultyButton.addEventListener("click", function () {
      gameScreen.style.display = "none";
      difficultyScreen.style.display = "flex";
      selectedLevel = null;
    });
  </script>
</body>
</html>
