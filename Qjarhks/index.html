<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>치매예방 틀린그림찾기</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    button {
      border: none; border-radius: 999px; padding: 12px 28px;
      font-size: 18px; cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
    }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid #315a9b; outline-offset: 3px; }
    #start-button, #game-start-button, .difficulty-button {
      min-width: 140px; background-color: #dcecff; color: #23446e;
    }
    #start-button:hover, #game-start-button:hover, .difficulty-button:hover {
      background-color: #c6e0ff;
    }
    .back-button {
      position: fixed; top: 16px; left: 16px; padding: 10px 20px;
      background-color: #eeeeee; color: #333333; font-size: 16px;
    }
    .back-button:hover { background-color: #dddddd; }
    #main-screen, #ready-screen, #game-screen {
      flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; box-sizing: border-box; text-align: center;
    }
    #main-screen { display: flex; }
    #ready-screen, #game-screen { display: none; padding: 80px 16px 24px; }
    #difficulty-screen {
      display: none; flex-direction: column; align-items: center;
      min-height: 100vh; box-sizing: border-box; padding-top: 33vh;
    }
    #difficulty-screen h2 { margin: 0 0 16px; }
    .difficulty-buttons { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #timer { position: fixed; top: 20px; right: 20px; font-size: 24px; font-weight: bold; }
    #game-container {
      display: grid; gap: 4px; width: min(80vw, 60vh, 500px); aspect-ratio: 1;
    }
    .game-cell { border: 1px solid #aab4c1; min-width: 0; min-height: 0; }
  </style>
</head>
<body>
  <div id="main-screen">
    <h1>치매예방 틀린그림찾기</h1>
    <button type="button" id="start-button">시작</button>
  </div>

  <div id="difficulty-screen">
    <button type="button" id="back-to-main" class="back-button">뒤로가기</button>
    <h2>난이도를 선택하세요</h2>
    <div class="difficulty-buttons">
      <button type="button" class="difficulty-button" data-level="하">하</button>
      <button type="button" class="difficulty-button" data-level="중">중</button>
      <button type="button" class="difficulty-button" data-level="상">상</button>
    </div>
  </div>

  <div id="ready-screen">
    <button type="button" id="back-to-difficulty" class="back-button">뒤로가기</button>
    <h2>준비되었으면 시작버튼을 눌러주세요</h2>
    <button type="button" id="game-start-button">게임 시작</button>
  </div>

  <div id="game-screen">
    <button type="button" id="back-to-ready" class="back-button">뒤로가기</button>
    <div id="timer" role="timer" aria-label="남은 시간">00:00</div>
    <div id="game-container" aria-label="게임 격자"></div>
  </div>

  <script>
    const mainScreen = document.getElementById("main-screen");
    const difficultyScreen = document.getElementById("difficulty-screen");
    const readyScreen = document.getElementById("ready-screen");
    const gameScreen = document.getElementById("game-screen");
    const gameContainer = document.getElementById("game-container");
    const timer = document.getElementById("timer");
    const settings = {
      "하": { size: 3, seconds: 180 },
      "중": { size: 4, seconds: 120 },
      "상": { size: 5, seconds: 60 }
    };
    let selectedLevel = null;
    let timerId = null;

    function showScreen(screen) {
      [mainScreen, difficultyScreen, readyScreen, gameScreen].forEach(function (item) {
        item.style.display = item === screen ? "flex" : "none";
      });
    }

    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
    }

    function displayTime(seconds) {
      const minutes = String(Math.floor(seconds / 60)).padStart(2, "0");
      const remainingSeconds = String(seconds % 60).padStart(2, "0");
      timer.textContent = minutes + ":" + remainingSeconds;
    }

    function startGame() {
      const config = settings[selectedLevel];
      if (!config) return;
      stopTimer();
      gameContainer.replaceChildren();
      gameContainer.style.gridTemplateColumns = `repeat(${config.size}, 1fr)`;
      gameContainer.style.gridTemplateRows = `repeat(${config.size}, 1fr)`;
      for (let i = 0; i < config.size * config.size; i++) {
        const cell = document.createElement("div");
        cell.className = "game-cell";
        gameContainer.appendChild(cell);
      }
      showScreen(gameScreen);
      const endTime = Date.now() + config.seconds * 1000;
      displayTime(config.seconds);
      timerId = setInterval(function () {
        const remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
        displayTime(remaining);
        if (remaining === 0) stopTimer();
      }, 1000);
    }

    document.getElementById("start-button").addEventListener("click", function () {
      showScreen(difficultyScreen);
    });
    document.querySelectorAll(".difficulty-button").forEach(function (button) {
      button.addEventListener("click", function () {
        selectedLevel = button.dataset.level;
        showScreen(readyScreen);
      });
    });
    document.getElementById("game-start-button").addEventListener("click", startGame);
    document.getElementById("back-to-main").addEventListener("click", function () {
      showScreen(mainScreen);
    });
    document.getElementById("back-to-difficulty").addEventListener("click", function () {
      selectedLevel = null;
      showScreen(difficultyScreen);
    });
    document.getElementById("back-to-ready").addEventListener("click", function () {
      stopTimer();
      showScreen(readyScreen);
    });
  </script>
</body>
</html>
