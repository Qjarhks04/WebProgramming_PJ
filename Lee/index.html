<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아디나의 별빛 야바위</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; color: #f5edff; background: radial-gradient(circle at 50% 12%, #4b2d78 0, #1a1646 40%, #090c25 100%); }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .55; background-image: radial-gradient(2px 2px at 15% 20%, white 50%, transparent 70%), radial-gradient(2px 2px at 73% 30%, #d9c4ff 50%, transparent 70%), radial-gradient(1px 1px at 42% 72%, white 50%, transparent 70%); background-size: 230px 220px, 300px 270px, 180px 190px; }
  .screen { position: relative; min-height: 100vh; padding: 24px; }
  .screen[hidden] { display: none; }
  #main-screen { overflow: hidden; isolation: isolate; }
  #main-screen::before { content: ''; position: absolute; z-index: -2; inset: -3%; background: url('adina-background.jpg') center / cover no-repeat; animation: drift 9s ease-in-out infinite alternate; }
  #main-screen::after { content: ''; position: absolute; z-index: -1; inset: 0; background: linear-gradient(90deg, #090c2540, #090c2590); }
  #main-screen h1, #main-screen p { text-shadow: 0 2px 12px #080817; }
  @keyframes drift { from { transform: scale(1.04) translate(-.5%, -.3%); } to { transform: scale(1.08) translate(.5%, .3%); } }
  .center { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; text-align: center; }
  h1, p { margin: 0; }
  h1 { letter-spacing: .04em; }
  .primary { border: 1px solid #d8b8ff; border-radius: 999px; background: #6941a0; color: white; padding: 13px 28px; font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #ffdc94; outline-offset: 4px; }
  .header { max-width: 900px; margin: auto; display: flex; justify-content: space-between; gap: 12px; color: #e4d4ff; }
  .game-content { width: min(900px, 100%); margin: 24px auto 0; text-align: center; }
  .character { width: min(100%, 320px); height: 200px; margin: 0 auto 18px; display: grid; place-items: center; overflow: hidden; border: 1px solid #a784d2; border-radius: 24px; background: #16102f; box-shadow: 0 0 35px #a775e955; }
  .character video { width: 100%; height: 100%; object-fit: contain; }
  /* 캐릭터 이미지를 쓰려면 위 video를 img로 바꾸고 경로를 지정하세요. */
  .character.swallow { animation: glow .65s ease-in-out; }
  @keyframes glow { 50% { box-shadow: 0 0 60px 15px #e5c0ff99; transform: scale(1.03); } }
  #message { min-height: 3em; margin: 14px 0 0; color: #e5d5fa; }
  .board { position: relative; width: 100%; height: 220px; margin: 0 auto; }
  /* 수정구 이미지 파일을 교체하려면 아래 crystal-orb.png 경로를 변경하세요. */
  .orb { position: absolute; left: 0; top: 0; width: var(--orb-size); height: var(--orb-size); border-radius: 50%; border: 1px solid #e2c7ff; cursor: pointer; color: #fff; font: inherit; font-weight: bold; background: transparent url("crystal-orb.png") center / contain no-repeat; box-shadow: inset -8px -10px 18px #140c4988, 0 0 20px #a77bff99; transition: transform var(--duration, 0ms) ease-in-out, opacity .5s ease; will-change: transform; }
  .orb:disabled { cursor: default; }
  .orb.selected { animation: orb-tap .3s ease-out; }
  @keyframes orb-tap { 0% { scale: 1; filter: brightness(1); } 40% { scale: .92; filter: brightness(1.3); box-shadow: 0 0 24px #e5dcffbb; } 100% { scale: 1; filter: brightness(1); } }
  .orb.target { box-shadow: inset -8px -10px 18px #140c4988, 0 0 0 4px #ffdc94, 0 0 30px #ffc962; }
  .orb.target::after { content: '✦'; position: absolute; inset: 0; display: grid; place-items: center; color: #fff3bd; font-size: 1.7rem; text-shadow: 0 0 10px #fff; }
  .bgm-frame { position: fixed; width: 200px; height: 200px; left: -10000px; top: 0; border: 0; }
  .cutscene { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; padding: 20px; overflow: hidden; isolation: isolate; background: #08051b; opacity: 0; transition: opacity .65s ease; }
  .cutscene.visible { opacity: 1; }
  .cutscene::before { content: ''; position: absolute; z-index: -2; inset: -30px; background: var(--scene-bg) center / cover no-repeat; filter: blur(20px) brightness(.35); transform: scale(1.1); }
  .cutscene::after { content: ''; position: absolute; z-index: -1; inset: 0; background: linear-gradient(180deg, #10092b88, #08051bcc); }
  .cutscene[hidden] { display: none; }
  .cutscene-card { width: min(90vw, 480px); padding: 18px; text-align: center; background: transparent; border: 0; box-shadow: none; opacity: 0; transform: translateY(20px) scale(.97); transition: opacity .8s ease, transform .8s ease; }
  .cutscene.visible .cutscene-card { opacity: 1; transform: translateY(0) scale(1); }
  .cutscene-card img { display: block; width: 100%; max-height: 55vh; object-fit: contain; margin-bottom: 18px; -webkit-mask-image: radial-gradient(ellipse 74% 75% at center, #000 54%, transparent 100%); mask-image: radial-gradient(ellipse 74% 75% at center, #000 54%, transparent 100%); }
  .cutscene-card p { font-size: 1.25rem; font-weight: bold; text-shadow: 0 2px 12px #000, 0 0 20px #000; }
  #game-over { isolation: isolate; overflow: hidden; }
  #game-over-video { position: absolute; z-index: -2; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: final-zoom 5s ease-out forwards; }
  #game-over::before { content: ''; position: absolute; z-index: -1; inset: 0; background: #08031b30; }
  #game-over .menu-button { position: absolute; right: max(24px, env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom)); background: #ffffff1a; border: 1px solid #ffffff80; color: white; backdrop-filter: blur(6px); text-shadow: 0 1px 5px #000; }
  #game-over .menu-button:hover { background: #ffffff38; }
  @keyframes final-zoom { from { transform: scale(1); } to { transform: scale(1.3); } }
  .hint { color: #c5b4e5; font-size: .9rem; }
  @media (max-width: 500px) { .screen { padding: 18px; } .character { height: 160px; } .board { height: 190px; } }
  @media (prefers-reduced-motion: reduce) { .character.swallow, #main-screen::before, #game-over-video, .orb.selected { animation: none; } .cutscene, .cutscene-card { transition: none; } }
</style>
</head>
<body>
<main id="main-screen" class="screen center">
  <p>✦ 별들의 운명을 따라 ✦</p><h1>아디나의 별빛 야바위</h1>
  <p>빛나는 수정구의 움직임을 지켜보세요.</p>
  <button class="primary" id="start" type="button">계속하기</button>
</main>
<div id="bgm-player"></div>
<section id="game-screen" class="screen" hidden aria-label="게임 화면">
  <header class="header"><strong id="stage"></strong><strong id="lives"></strong></header>
  <div class="game-content">
    <div class="character" id="character" aria-label="아디나 캐릭터 영역">
      <video src="adina.mp4" autoplay loop muted playsinline aria-label="아디나 영상"></video>
    </div>
    <h1>별빛 수정구를 찾아보세요</h1>
    <p id="message" role="status" aria-live="polite"></p>
    <div id="board" class="board" aria-label="수정구 선택"></div>
    <p class="hint">빛나는 수정구를 기억하고 셔플이 끝나면 선택하세요.</p>
  </div>
</section>
<section id="game-over" class="screen center" hidden><video id="game-over-video" src="game-over-video.mp4" preload="auto" playsinline loop aria-label="게임 오버 영상"></video><button id="video-play" class="primary" type="button" hidden>영상 재생</button><button id="back-to-main" class="primary menu-button" type="button">시작화면</button></section>
<section id="victory" class="screen center" hidden><h1>게임 클리어 ✦</h1><p>모든 별빛 수정구를 찾았어요!</p><button class="primary restart" type="button">다시 시작</button></section>
<div id="cutscene" class="cutscene" hidden role="dialog" aria-modal="true" aria-labelledby="cutscene-text">
  <div class="cutscene-card"><img id="cutscene-image" alt="실패 컷신" referrerpolicy="no-referrer"><p id="cutscene-text"></p></div>
</div>
<script>
  // 자동재생이 차단된 브라우저에서는 첫 화면의 사용자 입력 시 다시 시도합니다.
  const bgmPlayer = document.getElementById('bgm-player');
  function stopBgm() { bgmPlayer.replaceChildren(); }
  function playBgm(videoId) {
    stopBgm();
    const frame = document.createElement('iframe');
    frame.className = 'bgm-frame'; frame.title = '배경음악';
    frame.allow = 'autoplay; encrypted-media';
    frame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}&playsinline=1`;
    bgmPlayer.appendChild(frame);
  }
  function startBgm() { if (!document.getElementById('main-screen').hidden) playBgm('jMLf7hWQ6JM'); }
  startBgm();
  document.getElementById('main-screen').addEventListener('pointerdown', event => {
    if (!event.target.closest('#start')) startBgm();
  }, { once: true });
  const cutscenes = {
    2: { image: 'cutscene-1.jpg', voice: 'voice-1.m4a', text: '실수하지 말라고 소년' },
    1: { image: 'cutscene-2.jpg', voice: 'voice-2.m4a', text: '이제 한 목숨 남았으니 조심하는게 좋을거야 BOY~' },
    0: { image: 'cutscene-3.jpg', voice: 'voice-3.m4a', text: 'Hey~ Boy~ 조심하라고 했지~ 일로와' }
  };
  async function showCutscene(lives) {
    const overlay = document.getElementById('cutscene');
    const image = document.getElementById('cutscene-image');
    image.hidden = false;
    image.onerror = () => { image.hidden = true; };
    image.src = cutscenes[lives].image;
    overlay.style.setProperty('--scene-bg', `url("${cutscenes[lives].image}")`);
    document.getElementById('cutscene-text').textContent = cutscenes[lives].text;
    overlay.hidden = false;
    // 프레임을 나누어 나타나는 전환을 확실히 실행합니다.
    await new Promise(requestAnimationFrame);
    await new Promise(requestAnimationFrame);
    overlay.classList.add('visible');
    const voice = new Audio(cutscenes[lives].voice);
    const voiceFinished = new Promise(resolve => {
      voice.onended = resolve;
      voice.onerror = resolve;
      voice.play().catch(resolve);
      setTimeout(resolve, 12000);
    });
    await Promise.all([sleep(2600), voiceFinished]);
    voice.pause();
    overlay.classList.remove('visible');
    await sleep(650);
    overlay.hidden = true;
  }
  // 단계별 수정구 수, 섞는 횟수, 한 번 교차하는 시간(ms).
  const levels = [
    { count: 3, swaps: 4, duration: 700 },
    { count: 5, swaps: 7, duration: 500 },
    { count: 10, swaps: 20, duration: 120 }
  ];
  const state = { level: 0, lives: 3, target: 0, orbs: [], accepting: false, round: 0 };
  const screens = document.querySelectorAll('.screen');
  const board = document.getElementById('board');
  const character = document.getElementById('character');
  const message = document.getElementById('message');
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  const gameOverVideo = document.getElementById('game-over-video');
  function showScreen(id) {
    stopBgm();
    gameOverVideo.pause();
    if (id !== 'game-over') gameOverVideo.currentTime = 0;
    screens.forEach(screen => { screen.hidden = screen.id !== id; });
    if (id === 'game-over') {
      document.getElementById('video-play').hidden = true;
      gameOverVideo.currentTime = 0;
      gameOverVideo.play().catch(() => { document.getElementById('video-play').hidden = false; });
    }
  }
  // Web Audio로 짧은 클릭과 정답/오답 효과음을 합성합니다.
  let soundContext;
  function playEffect(kind) {
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      soundContext ||= new AudioContextClass();
      if (soundContext.state === 'suspended') soundContext.resume().catch(() => {});
      const ctx = soundContext, now = ctx.currentTime;
      const notes = kind === 'correct' ? [660, 880] : kind === 'wrong' ? [300, 200] : [520];
      notes.forEach((frequency, index) => {
        const at = now + index * .09, osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(frequency, at);
        gain.gain.setValueAtTime(.0001, at); gain.gain.exponentialRampToValueAtTime(.055, at + .015);
        gain.gain.exponentialRampToValueAtTime(.0001, at + .14);
        osc.connect(gain); gain.connect(ctx.destination); osc.start(at); osc.stop(at + .15);
      });
    } catch (_) { /* 효과음이 실패해도 게임은 계속됩니다. */ }
  }
  function setStatus(text) { message.textContent = text; }
  function updateHeader() {
    document.getElementById('stage').textContent = `${state.level + 1}단계`;
    document.getElementById('lives').textContent = `남은 목숨: ${state.lives}개`;
  }
  // 한 행에 최대 다섯 개씩 배치해 모바일에서도 수정구가 겹치지 않습니다.
  function position(slot, count) {
    const cols = Math.min(count, 5);
    const rows = Math.ceil(count / cols);
    const width = board.clientWidth;
    const size = Math.min(72, (width - (cols - 1) * 10) / cols);
    const row = Math.floor(slot / cols), col = slot % cols;
    const inRow = Math.min(cols, count - row * cols);
    const gap = Math.min(24, Math.max(10, (width - inRow * size) / Math.max(1, inRow - 1)));
    const rowWidth = inRow * size + (inRow - 1) * gap;
    const x = (width - rowWidth) / 2 + col * (size + gap);
    const y = row * (size + 16) + (rows === 1 ? 30 : 5);
    return { x, y, size };
  }
  function place(orb, duration = 0, lane = 0) {
    const p = position(orb.slot, state.orbs.length);
    orb.el.style.setProperty('--orb-size', `${p.size}px`);
    orb.el.style.setProperty('--duration', `${duration}ms`);
    orb.el.style.transform = `translate(${p.x}px, ${p.y + lane}px)`;
  }
  function renderPositions() { state.orbs.forEach(orb => place(orb)); }
  function createOrbs() {
    board.replaceChildren(); state.orbs = [];
    const count = levels[state.level].count;
    state.target = Math.floor(Math.random() * count);
    for (let i = 0; i < count; i++) {
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'orb'; el.disabled = true;
      el.setAttribute('aria-label', `수정구 ${i + 1}`);
      const orb = { id: i, slot: i, el };
      el.addEventListener('click', () => choose(orb));
      board.appendChild(el); state.orbs.push(orb);
    }
    renderPositions();
  }
  async function runRound(feedback = '') {
    const token = ++state.round;
    state.accepting = false; updateHeader(); createOrbs();
    const target = state.orbs[state.target];
    target.el.classList.add('target');
    setStatus(`${feedback} 빛나는 수정구를 기억하세요.`.trim());
    await sleep(1400);
    if (token !== state.round) return;
    // 정답 수정구의 빛이 아디나에게 흡수되는 연출. 수정구 자체는 다시 나타나 섞입니다.
    setStatus('아디나가 별빛을 삼키고 있어요…');
    const orbRect = target.el.getBoundingClientRect();
    const charRect = character.getBoundingClientRect();
    const p = position(target.slot, state.orbs.length);
    target.el.style.setProperty('--duration', '650ms');
    target.el.style.transform = `translate(${p.x + charRect.left + charRect.width / 2 - (orbRect.left + orbRect.width / 2)}px, ${p.y + charRect.top + charRect.height / 2 - (orbRect.top + orbRect.height / 2)}px) scale(.15)`;
    target.el.style.opacity = '0'; character.classList.add('swallow');
    await sleep(700);
    if (token !== state.round) return;
    character.classList.remove('swallow'); target.el.classList.remove('target');
    place(target); target.el.style.opacity = '1';
    await sleep(350);
    if (token !== state.round) return;
    setStatus('수정구가 섞이고 있어요. 눈을 떼지 마세요!');
    const { swaps, duration } = levels[state.level];
    for (let n = 0; n < swaps; n++) {
      const a = Math.floor(Math.random() * state.orbs.length);
      let b = Math.floor(Math.random() * (state.orbs.length - 1));
      if (b >= a) b++;
      const first = state.orbs[a], second = state.orbs[b];
      [first.slot, second.slot] = [second.slot, first.slot];
      // 서로 다른 깊이로 교차하도록 그림자 순서를 번갈아 바꿉니다.
      first.el.style.zIndex = n % 2 ? '1' : '2'; second.el.style.zIndex = n % 2 ? '2' : '1';
      place(first, duration); place(second, duration);
      await sleep(duration + 50);
      if (token !== state.round) return;
    }
    state.orbs.forEach(orb => { orb.el.disabled = false; });
    state.accepting = true; setStatus('별빛이 담긴 수정구를 선택하세요!');
  }
  async function choose(orb) {
    if (!state.accepting) return;
    state.accepting = false;
    state.orbs.forEach(item => { item.el.disabled = true; });
    playEffect('click');
    orb.el.classList.add('selected');
    await sleep(300);
    if (orb.id === state.target) {
      playEffect('correct');
      if (state.level === levels.length - 1) { showScreen('victory'); return; }
      state.level++; runRound('정답! 다음 단계입니다.');
    } else {
      playEffect('wrong');
      state.lives--; updateHeader();
      await showCutscene(state.lives);
      if (state.lives === 0) { showScreen('game-over'); return; }
      runRound('아쉬워요! 같은 단계에서 다시 도전합니다.');
    }
  }
  function startGame() { state.level = 0; state.lives = 3; showScreen('game-screen'); runRound(); }
  document.getElementById('start').addEventListener('click', startGame);
  document.getElementById('video-play').addEventListener('click', () => { gameOverVideo.play().then(() => { document.getElementById('video-play').hidden = true; }).catch(() => {}); });
  document.getElementById('back-to-main').addEventListener('click', () => { showScreen('main-screen'); startBgm(); });
  document.querySelectorAll('.restart').forEach(button => button.addEventListener('click', startGame));
  window.addEventListener('resize', () => { if (state.accepting) renderPositions(); });
</script>
</body>
</html>
